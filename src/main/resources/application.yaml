spring:
  application:
    name: LoyaltyBot

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bot_db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:pass}

  liquibase:
    change-log: db/changelog/changelog-master.yaml

  thymeleaf:
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    check-template-location: true
    check-template-existence: true


  mvc:
    hiddenmethod:
      filter:
        enabled: true


  telegram:
    bot:
      name: ${TELEGRAM_BOT_NAME:new_loyalty_bot}
      token: ${TELEGRAM_BOT_TOKEN}

  password_generator:
    3

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    com.example.LoyaltyBot: DEBUG
    org.springframework.security.web.authentication: DEBUG
    org.springframework.security.authentication: DEBUG


outbox:
  enabled: true
  batch-size: 50
  lease-duration: 2m
  poll-interval: 5s
  reaper-interval: 1m
  max-attempts: 5
  retry:
    base: 1m
    multiplier: 2.0
    max: 1h
  cleanup:
    enabled: true
    cron: "0 0 3 * * *"
    retentionDays: 30
  sender:
    type: telegram







