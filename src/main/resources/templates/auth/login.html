<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <style>
        .form-signin {
            width: 100%;
            max-width: 330px;
            padding: 15px;
            margin: auto;                    /* центрирует по горизонтали */
            margin-top: 50vh;               /* сдвигает вниз на половину экрана */
            transform: translateY(50%);    /* поднимает на половину своей высоты */
        }
    </style>
</head>
<body class="text-center">
<main class="form-signin w-100 m-auto">
    <h3 class="h3 mb-3 fw-normal"> Login</h3>
    <div class="md-3">
        <form  th:action="@{/perform-login}" method="post">
            <div class="form-floating">
                <input class="form-control" type="text" id="username" name="username" required />
                <label class="form-label" for="username">Username:</label>

            </div >
            <div class="form-floating md-3">
                <input class="form-control" type="password" id="password" name="password" required />
                <label class="form-label" for="password">Password:</label>
            </div>
            <br>
            <button class="w-100 btn btn-lg btn-primary " type="submit">Войти</button>
        </form>
    </div>

    <div th:if="${param.error}" style="color: red;">
        ❌ Неверное имя пользователя или пароль
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
