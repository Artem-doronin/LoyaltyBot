<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Все клиенты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
          crossorigin="anonymous">
</head>
<body>
<section>
    <div class="container">

        <div th:if="${successMessage}"
             style="color: green; border: 1px solid green; padding: 15px; margin-bottom: 20px; background: #e8f5e9; border-radius: 4px;">
            ✅ <span th:text="${successMessage}"></span>
        </div>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/">Клиенты</a>

                <div class="d-flex ms-auto" sec:authorize="isAuthenticated()">
                    <a class="btn btn-danger" href="/logout">🚪 Выйти</a>
                </div>
            </div>
        </nav>

        <table class=" table-success table-striped mt-3 table table-bordered">
            <thead>
            <tr>
                <th>Username</th>
                <th>Имя</th>
                <th>Телефон</th>
                <th>День рождения</th>
                <th>Бонусы</th>
                <th>Потрачено</th>
                <th>Статус</th>
                <th>Функции</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="client : ${clients}" th:if="${clients != null and !clients.isEmpty()}">
                <td th:text="${client.telegramUsername}"></td>
                <td th:text="${client.firstName}"></td>
                <td th:text="${client.phone}"></td>
                <td th:text="${client.birthday}"></td>
                <td th:text="${client.bonusBalance}"></td>
                <td th:text="${client.totalSpent}"></td>
                <td th:text="${client.registrationState}"></td>
                <td><form th:action="@{/clients/{id}(id=${client.id})}"
                          method="get"
                          style="display: inline;"
                          onsubmit="return confirm('Посмотреть пользователя');">
                    <button class="btn btn-primary" type="submit">Подробнее</button>
                </form>
                </td>
            </tr>
            <tr th:if="${clients == null or clients.isEmpty()}">
                <td colspan="11" class="empty">Нет клиентов</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
