<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Все клиенты</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f8f9fa;
        }
        .btn-edit {
            background: #2196F3;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 13px;
            display: inline-block;
        }
        .btn-edit:hover {
            background: #1976D2;
        }
        .btn-delete {
            background: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
        }
        .btn-delete:hover {
            background: #d32f2f;
        }
        .form-inline {
            display: inline;
        }
        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-gold {
            background: #FFD700;
            color: #333;
        }
        .badge-silver {
            background: #C0C0C0;
            color: #333;
        }
        .badge-bronze {
            background: #CD7F32;
            color: white;
        }
        .badge-platinum {
            background: #E5E4E2;
            color: #333;
        }
        .empty {
            text-align: center;
            color: #888;
            padding: 40px;
            font-size: 18px;
        }
        .btn-add {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .btn-add:hover {
            background: #45a049;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>👥 Все клиенты</h1>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Chat ID</th>
        <th>Username</th>
        <th>Имя</th>
        <th>Фамилия</th>
        <th>Телефон</th>
        <th>День рождения</th>
        <th>Бонусы</th>
        <th>Потрачено</th>
        <th>Уровень</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="client : ${clients}" th:if="${clients != null and !clients.isEmpty()}">
        <td th:text="${client.id}"></td>
        <td th:text="${client.chatId}"></td>
        <td th:text="${client.telegramUsername}"></td>
        <td th:text="${client.firstName}"></td>
        <td th:text="${client.lastName}"></td>
        <td th:text="${client.phone}"></td>
        <td th:text="${client.birthday}"></td>
        <td th:text="${client.bonusBalance}"></td>
        <td th:text="${client.totalSpent}"></td>
        <td>
                <span class="badge"
                      th:classappend="${client.getLoyaltyLevel() == 'GOLD' ? 'badge-gold' :
                                    (client.getLoyaltyLevel() == 'SILVER' ? 'badge-silver' :
                                    (client.getLoyaltyLevel() == 'PLATINUM' ? 'badge-platinum' : 'badge-bronze'))}"
                      th:text="${client.getLoyaltyLevel()}">
                </span>
        </td>
        <td>
            <div class="actions">
                <a th:href="@{/clients/{id}/edit(id=${client.id})}" class="btn-edit">✏️</a>

                <form th:action="@{/clients/{id}(id=${client.id})}" method="post" class="form-inline">
                    <input type="hidden" name="_method" value="DELETE"/>
                    <button type="submit" class="btn-delete" onclick="return confirm('Удалить клиента?')">🗑️</button>
                </form>
            </div>
        </td>
    </tr>
    <tr th:if="${clients == null or clients.isEmpty()}">
        <td colspan="11" class="empty">Нет клиентов</td>
    </tr>
    </tbody>
</table>

</body>
</html>
