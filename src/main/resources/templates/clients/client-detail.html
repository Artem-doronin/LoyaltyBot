<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Карточка клиента</title>

<div class="card" th:if="${client != null}">
    <!-- Заголовок -->
    <div class="card-header">
        <h1>👤 Карточка клиента</h1>
        <a href="/clients" class="back-link">← Назад к списку</a>
    </div>

    <!-- Основная информация -->
    <div class="info-grid">
        <div class="info-item">
            <span class="label">ID</span>
            <span class="value" th:text="${client.id}"></span>
        </div>
        <div class="info-item">
            <span class="label">Chat ID</span>
            <span class="value" th:text="${client.chatId}"></span>
        </div>
        <div class="info-item">
            <span class="label">Имя</span>
            <span class="value" th:text="${client.firstName}"></span>
        </div>
        <div class="info-item">
            <span class="label">Фамилия</span>
            <span class="value" th:text="${client.lastName}"></span>
        </div>
        <div class="info-item">
            <span class="label">Telegram Username</span>
            <span class="value" th:text="${client.telegramUsername}"></span>
        </div>
        <div class="info-item">
            <span class="label">Телефон</span>
            <span class="value" th:text="${client.phone} ?: '—'"></span>
        </div>
        <div class="info-item">
            <span class="label">День рождения</span>
            <span class="value" th:text="${client.birthday} ?: '—'"></span>
        </div>
    </div>
