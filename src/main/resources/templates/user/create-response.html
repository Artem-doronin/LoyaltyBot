<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Пользователь создан</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>
<section>
    <div class="container">
        <h2>✅ Пользователь создан!</h2>

        <p><strong>Username:</strong> <span th:text="${login}"></span></p>

        <p><strong>🔑 Временный пароль:</strong> <span th:text="${temporaryPassword}"></span></p>

        <p>⚠️ <strong>Важно!</strong> Пользователь обязан сменить пароль при следующем входе.</p>

        <p>
            <a class="btn btn-primary" th:href="@{/users}">👥 Вернуться к списку</a>

            <a class="btn btn-primary" th:href="@{/users/create}">➕ Создать ещё</a>

        </p>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
