<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${action == 'CREATE' ? 'Пользователь создан' : 'Пароль сброшен'}"></title>
</head>
<body>
<h2 th:if="${action == 'CREATE'}">✅ Пользователь создан!</h2>
<h2 th:if="${action == 'RESET'}">🔄 Пароль сброшен!</h2>

<p><strong>Username:</strong> <span th:text="${login}"></span></p>

<p><strong>🔑 Временный пароль:</strong> <span th:text="${temporaryPassword}"></span></p>

<p>⚠️ <strong>Важно!</strong> Пользователь обязан сменить пароль при следующем входе.</p>

<p>
    <a th:href="@{/users}">👥 Вернуться к списку</a>
    <span th:if="${action == 'CREATE'}">
            | <a th:href="@{/users/create}">➕ Создать ещё</a>
        </span>
</p>
</body>
</html>
