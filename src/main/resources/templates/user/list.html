<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Все пользователи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>

<section>
<div class="container">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Пользователи</a>
            <div class="d-flex gap-2 ms-auto">

            <a class="btn btn-success" href="/users/create">➕ Добавить пользователя</a>

            <div class="d-flex ms-auto" sec:authorize="isAuthenticated()">
                <a class="btn btn-danger" href="/logout">🚪 Выйти</a>
            </div>
            </div>
        </div>
    </nav>

    <table class=" table-success table-striped mt-3 table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Роль</th>
            <th>Статус</th>
            <th>Функции</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}" th:if="${users != null and !users.isEmpty()}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.roleName}"></td>
            <td>
                <span th:if="${user.enabled}">✅ Активен</span>
                <span th:unless="${user.enabled}">❌ Заблокирован</span>
            </td>
            <td>
                <a class="btn btn-info" th:href="@{/users/edit/{id}(id=${user.id})}">Редактировать</a>

                <form  th:action="@{/users/toggle-enabled/{id}(id=${user.id})}"
                      method="post"
                      style="display: inline;">
                    <button class="btn btn-info" type="submit">
                        <span th:if="${user.enabled}">Заблокировать</span>
                        <span th:unless="${user.enabled}">Разблокировать</span>
                    </button>
                </form>

                <form  th:action="@{/users/delete/{id}(id=${user.id})}"
                      method="get"
                      style="display: inline;"
                      onsubmit="return confirm('Удалить пользователя?');">
                    <button class="btn btn-info" type="submit">Удалить</button>
                </form>

                <form th:action="@{/users/reset_password/{id}(id=${user.id})}"
                      method="post"
                      style="display: inline;"
                      onsubmit="return confirm('Сбросить пароль?');">
                    <button class="btn btn-info" type="submit">Сброс пароля</button>
                </form>
            </td>
        </tr>
        <tr th:if="${users == null or users.isEmpty()}">
            <td colspan="6">📭 Нет пользователей</td>
        </tr>
        </tbody>
    </table>
</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
