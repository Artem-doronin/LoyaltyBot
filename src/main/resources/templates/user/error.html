<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка</title>
</head>
<body>
<h1>😵 Ошибка</h1>

<div th:if="${status}">
    <p><strong>Статус:</strong> <span th:text="${status}"></span></p>
    <p><strong>Сообщение:</strong> <span th:text="${error}"></span></p>
    <p><strong>Время:</strong> <span th:text="${timestamp}"></span></p>
</div>

<div th:unless="${status}">
    <p>Произошла неизвестная ошибка</p>
</div>

<a href="/auth/login">🔐 Вернуться на страницу входа</a>
</body>
</html>
