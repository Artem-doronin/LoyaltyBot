<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Смена пароля</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>

<div th:if="${errorMessage}" style="color: red; border: 1px solid red; padding: 10px; margin-bottom: 20px;">
    <strong>❌ Ошибка:</strong> <span th:text="${errorMessage}"></span>
</div>
<h1>🔐 Смена пароля</h1>

<form th:action="@{/users/change_password}" method="post">
    <div>
        <label for="oldPassword">Старый пароль:</label>
        <input type="password" id="oldPassword" name="oldPassword" required />
    </div>
    <br/>

    <div>
        <label for="newPassword">Новый пароль:</label>
        <input type="password" id="newPassword" name="newPassword" required />
        <br/>
    </div>
    <br/>

    <div>
        <label for="confirmPassword">Подтвердите пароль:</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required />
    </div>
    <br/>

    <button type="submit">💾 Сменить пароль</button>
    <a href="/users/change_password">❌ сброс</a>
    <a class="nav-link btn btn-outline-danger" href="/logout">🚪 Выйти</a>
</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
