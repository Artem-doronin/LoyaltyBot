<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Главная</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">

    <!-- МИНИМАЛЬНЫЙ СВОЙ CSS -->
    <style>
        /* Всего 3 стиля! */
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .card {
            border-radius: 24px;
            border: none;
            max-width: 600px;
            margin: 0 auto;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd6, #6a3f9e);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card shadow-lg p-4">
        <div class="card-body text-center">

            <!-- Заголовок -->
            <h1 class="display-4 fw-bold text-primary" th:text="${message}">
                Добро пожаловать!
            </h1>

            <p class="lead text-muted mb-4">
                Spring Boot + Thymeleaf + Bootstrap
            </p>

            <!-- Год -->
            <div class="badge bg-primary bg-gradient px-4 py-2 mb-4 fs-6">
                📅 <span th:text="${year}">2026</span>
            </div>

            <!-- Кнопка -->
            <button class="btn btn-primary btn-lg w-100">
                🚀 Начать
            </button>

            <!-- Алёрты -->
            <div class="alert alert-success mt-4">
                ✅ Bootstrap успешно подключен!
            </div>

            <div class="alert alert-info">
                💡 Просто и красиво
            </div>

            <!-- Подвал -->
            <hr class="my-4">
            <small class="text-muted">
                Bootstrap 5.3 • Spring Boot 3.x • Thymeleaf
            </small>

        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
