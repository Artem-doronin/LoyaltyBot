version: '3.2'

volumes:
  loyalty_db_vol:

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://loyalty_db:5432/bot_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass
    depends_on:
      loyalty_db:
        condition: service_healthy
    restart: unless-stopped

  loyalty_db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=bot_db
    volumes:
      - loyalty_db_vol:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d bot_db" ]
      interval: 5s
      timeout: 5s
      retries: 1
