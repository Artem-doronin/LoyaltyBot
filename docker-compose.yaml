version: '3.2'

volumes:
  loyalty_db_vol:
  minio_storage:

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://loyalty_db:5432/bot_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass
    depends_on:
      loyalty_db:
        condition: service_healthy
    restart: unless-stopped

  loyalty_db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=bot_db
    volumes:
      - loyalty_db_vol:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d bot_db" ]
      interval: 5s
      timeout: 5s
      retries: 1

  minio:
    image: pgsty/silo:latest
    restart: unless-stopped
    command: server --console-address ":9001" /data/
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminadmin
    volumes:
      - minio_storage:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 20s
      retries: 3


